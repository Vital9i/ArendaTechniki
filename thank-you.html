<head>

  'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
  })(window,document,'script','dataLayer','GTM-PWKSP5TH');</script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Спасибо! — ТОПАГРОБЕЛ</title>
  <link rel="icon" href="images/logo_ekskavator_nadezhny_variant_1.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

<body class="thank-you-page">
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-PWKSP5TH"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->

  <div class="thank-you-page__backdrop">
    <div class="thank-you-page__window" role="dialog" aria-labelledby="thankYouTitle" aria-modal="true">
      <div class="thank-you">
        <div class="thank-you__icon" aria-hidden="true">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 6L9 17l-5-5"/>
          </svg>
        </div>
        <h1 class="thank-you__title" id="thankYouTitle">Спасибо!</h1>
        <p class="thank-you__text">Заявка отправлена. Олег свяжется с вами в ближайшее время.</p>
        <p class="thank-you__phone" id="thankYouPhone" hidden></p>
        <a href="index.html" class="btn btn--brown btn--full thank-you__btn">На главную</a>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var name = params.get('name') || '';
      var phone = params.get('phone') || '';
      var formId = params.get('form') || '';
      var source = params.get('source') || '';
      var equipment = params.get('equipment') || '';

      var title = document.getElementById('thankYouTitle');
      var phoneEl = document.getElementById('thankYouPhone');

      if (name && title) title.textContent = name + ', спасибо!';
      if (phone && phoneEl) {
        phoneEl.textContent = phone;
        phoneEl.hidden = false;
      }

      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({
        event: 'form_submit_success',
        pagePath: location.pathname,
        pageTitle: document.title,
        pageLocation: location.href,
        form_id: formId,
        form_source: source,
        equipment_name: equipment
      });
    })();
  </script>
</body>
